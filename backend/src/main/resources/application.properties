
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campanas_salud?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.jpa.hibernate.ddl-auto=update

# Puerto (Render lo asigna con la variable PORT)
server.port=${PORT:8080}

# Para que la página pueda mostrar el mensaje de error que envía el servidor
server.error.include-message=always
