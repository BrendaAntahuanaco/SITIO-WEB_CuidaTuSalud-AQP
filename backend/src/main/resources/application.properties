# Base de datos MySQL (la base campanas_salud se crea sola).
# Usuario y clave se pueden cambiar sin tocar el código con variables de entorno:
#   cmd:  set DB_USER=root   y   set DB_PASSWORD=tu_clave
spring.datasource.url=jdbc:mysql://localhost:3306/campanas_salud?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Para que la página pueda mostrar el mensaje de error que envía el servidor
server.error.include-message=always

# Cuenta de administrador que se crea la primera vez (variables de entorno opcionales).
# Si no defines ADMIN_PASSWORD, se genera una clave y se muestra UNA vez en la consola.
app.admin.correo=${ADMIN_CORREO:admin@cuidatusalud.pe}
app.admin.password=${ADMIN_PASSWORD:}

# Clave para firmar las sesiones. Si no defines TOKEN_SECRET (mínimo 16 caracteres),
# se genera una al iniciar y las sesiones se cierran al reiniciar el servidor.
app.token.secret=${TOKEN_SECRET:}
